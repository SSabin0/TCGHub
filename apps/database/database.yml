services:
  postgres:
    image: postgres
    container_name: tcghub-database
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB}
    ports:
      - "${DATABASE_PORT}:${DATABASE_HOST_PORT}"
    command:
    - "postgres"
    - "-c"
    - "listen_addresses=*"
    volumes:
      - postgres_data2:/var/lib/postgresql

volumes:
  postgres_data2:
