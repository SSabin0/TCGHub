services:
  postgres:
    image: postgres
    container_name: tcghub_database_test
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB}
    ports:
      - "${DATABASE_PORT}:${DATABASE_HOST_PORT}"
    volumes:
      - postgres_data_test:/var/lib/postgresql

volumes:
  postgres_data_test:
